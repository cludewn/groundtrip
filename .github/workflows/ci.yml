name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: pnpmをセットアップ
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 一時整形出力（修正後に削除）
        run: |
          pnpm exec prettier src/features/reflection-flow/api-client.ts src/features/reflection-flow/api-client.test.ts src/features/reflection-flow/reflection-flow.tsx src/features/reflection-flow/reflection-flow.test.tsx src/app/reflection/page.tsx --write
          node -e 'const fs=require("node:fs"); for(const f of process.argv.slice(1)){console.log("FORMATTED_FILE:"+f+" "+JSON.stringify(fs.readFileSync(f,"utf8")))}' src/features/reflection-flow/api-client.ts src/features/reflection-flow/api-client.test.ts src/features/reflection-flow/reflection-flow.tsx src/features/reflection-flow/reflection-flow.test.tsx src/app/reflection/page.tsx
      - name: フォーマット
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: 型チェック
        run: pnpm typecheck
      - name: テスト
        run: pnpm test
      - name: ビルド
        run: pnpm build

  firebase-emulators:
    name: Firebase Auth / Firestore Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:emulators
